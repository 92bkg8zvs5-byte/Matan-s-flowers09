services:
  - type: web
    name: flowers
    runtime: node
    plan: starter
    buildCommand: echo ok
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: flowers-data
      mountPath: /var/data
      sizeGB: 1
